<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" width="360" height="360">
  <title>An envelope and letter with a sprig of heather</title>
  <!-- Original illustration for Newcastle Tyne Valley Domiciliary Care. -->
  <rect width="360" height="360" fill="#dfe9e5"/>
  <circle cx="180" cy="190" r="128" fill="#eef3f1"/>

  <!-- Letter -->
  <g transform="rotate(-8 180 180)">
    <rect x="108" y="78" width="150" height="180" rx="6" fill="#ffffff"/>
    <g fill="none" stroke="#c9d6d1" stroke-width="5" stroke-linecap="round">
      <path d="M128 108h70M128 132h110M128 152h110M128 172h96M128 192h104"/>
    </g>
    <path fill="none" stroke="#6b3a6e" stroke-width="3" stroke-linecap="round" d="M130 222c8-8 14 4 20-4s10 2 16-2"/>
  </g>

  <!-- Envelope -->
  <g transform="rotate(6 180 250)">
    <rect x="70" y="190" width="220" height="130" rx="8" fill="#2f6470"/>
    <path fill="#24555f" d="M70 198l110 72 110-72v114a8 8 0 0 1-8 8H78a8 8 0 0 1-8-8z"/>
    <path fill="none" stroke="#173e48" stroke-width="3" d="M74 316l84-60M286 316l-84-60"/>
    <path fill="#357380" d="M70 198a8 8 0 0 1 8-8h204a8 8 0 0 1 8 8l-110 72z"/>
  </g>

  <!-- Heather sprig -->
  <g>
    <path fill="none" stroke="#5f7f4b" stroke-width="4" stroke-linecap="round" d="M84 306c40-30 90-48 150-58"/>
    <path fill="none" stroke="#5f7f4b" stroke-width="3" stroke-linecap="round" d="M150 274c8-10 18-16 30-18M190 260c10-8 22-12 34-12"/>
    <g fill="#8b5a8e">
      <circle cx="226" cy="246" r="7"/><circle cx="238" cy="244" r="6"/><circle cx="214" cy="250" r="6"/>
      <circle cx="198" cy="256" r="6.5"/><circle cx="184" cy="258" r="6"/><circle cx="170" cy="264" r="6"/>
      <circle cx="232" cy="236" r="5"/><circle cx="182" cy="248" r="5"/><circle cx="208" cy="240" r="5"/>
    </g>
    <g fill="#b58bb7">
      <circle cx="230" cy="243" r="2.5"/><circle cx="200" cy="253" r="2.5"/><circle cx="172" cy="261" r="2.2"/>
    </g>
  </g>
</svg>
