<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 60 640 660" width="640" height="660">
  <title>A cottage with a lit window above the River Tyne at dusk</title>
  <!-- Original illustration for Newcastle Tyne Valley Domiciliary Care. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9d2d0"/>
      <stop offset=".38" stop-color="#e6dcc0"/>
      <stop offset=".58" stop-color="#f6cf94"/>
      <stop offset=".7" stop-color="#f4b97a"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff1cf" stop-opacity=".95"/>
      <stop offset=".45" stop-color="#fbe2ad" stop-opacity=".55"/>
      <stop offset="1" stop-color="#f7cf94" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3dcb4"/>
      <stop offset=".35" stop-color="#cfe0d9"/>
      <stop offset="1" stop-color="#9fc4c6"/>
    </linearGradient>
    <radialGradient id="windowGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffd77a" stop-opacity=".9"/>
      <stop offset="1" stop-color="#ffd77a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Sky and low sun -->
  <rect width="640" height="720" fill="url(#sky)"/>
  <circle cx="214" cy="392" r="120" fill="url(#sunGlow)"/>
  <circle cx="214" cy="396" r="40" fill="#fff0cc"/>

  <!-- Soft cloud streaks -->
  <g fill="#ffffff" opacity=".38">
    <ellipse cx="470" cy="150" rx="86" ry="9"/>
    <ellipse cx="520" cy="166" rx="54" ry="6"/>
    <ellipse cx="150" cy="210" rx="70" ry="7"/>
  </g>

  <!-- Birds -->
  <g fill="none" stroke="#4f6a6c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M396 196q7-7 13 0 6-7 13 0"/>
    <path d="M436 226q5-5 10 0 5-5 10 0"/>
    <path d="M362 238q4-4 8 0 4-4 8 0"/>
  </g>

  <!-- Far fells -->
  <path fill="#a7bfba" d="M0 404c70-26 140-40 214-30s130 26 196 12 150-48 230-40v374H0z"/>
  <path fill="#8daa9e" d="M0 438c80-24 160-26 236-12 64 12 122 8 190-14 76-24 150-30 214-20v328H0z"/>

  <!-- Cottage hill -->
  <path fill="#6f9479" d="M0 488c88-14 176-14 262-22 70-6 112-40 170-52 70-14 140-4 208 12v294H0z"/>

  <!-- Field walls -->
  <g fill="none" stroke="#5a7f64" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="1 6">
    <path d="M24 520c80-14 170-18 250-40 46-12 84-30 128-44"/>
    <path d="M476 446c46 10 104 20 164 22"/>
    <path d="M512 500c40-6 86-8 128-4"/>
  </g>

  <!-- Trees beside the cottage -->
  <g>
    <path stroke="#4a3b2c" stroke-width="3" d="M342 428v16M478 420v14M498 424v12"/>
    <circle cx="342" cy="412" r="20" fill="#4f7c60"/>
    <circle cx="326" cy="424" r="13" fill="#5a8a69"/>
    <circle cx="478" cy="404" r="17" fill="#4f7c60"/>
    <circle cx="498" cy="412" r="12" fill="#5a8a69"/>
  </g>

  <!-- Cottage -->
  <ellipse cx="407" cy="412" rx="92" ry="64" fill="url(#windowGlow)" opacity=".55"/>
  <rect x="418" y="346" width="12" height="24" fill="#8a6a4f"/>
  <rect x="415" y="342" width="18" height="6" rx="1.5" fill="#6f5440"/>
  <rect x="372" y="390" width="72" height="46" fill="#dcbd8f"/>
  <path fill="#c7a776" d="M372 390h72v6h-72z"/>
  <path fill="#33444c" d="M364 394l18-30h52l18 30z"/>
  <path fill="#2a3940" d="M364 394h88v4h-88z"/>
  <rect x="381" y="402" width="15" height="14" rx="1.5" fill="#ffcf5c"/>
  <rect x="420" y="402" width="15" height="14" rx="1.5" fill="#ffcf5c"/>
  <path stroke="#c99a3c" stroke-width="1.6" d="M388.5 402v14M381 409h15M427.5 402v14M420 409h15"/>
  <path fill="#6b3a6e" d="M401 436v-20a6.5 6.5 0 0 1 13 0v20z"/>
  <circle cx="410.5" cy="427" r="1.4" fill="#f2b53c"/>
  <path fill="#7d9c66" d="M344 438c40-6 90-6 126 0v10H344z"/>

  <!-- The river, winding down from the fells -->
  <path fill="url(#water)" d="M258 462C236 488 160 500 158 534C156 576 300 586 284 640C272 680 180 700 134 720H368C404 692 432 650 402 610C372 570 232 560 228 530C226 506 256 486 266 462Z"/>
  <g fill="none" stroke="#f3f8f6" stroke-width="3" stroke-linecap="round" opacity=".9">
    <path d="M218 494c-12 8-22 16-24 26"/>
    <path d="M232 570c22 8 40 18 46 30"/>
    <path d="M300 654c-10 18-30 32-56 44"/>
    <path d="M210 540c10 6 22 10 36 14"/>
  </g>

  <!-- Near banks -->
  <path fill="#4d7b5b" d="M0 560c50-10 104-8 138 4 22 8 24 22 14 34-14 18-26 28-14 52 10 20 16 42-4 70H0z"/>
  <path fill="#3f6a4d" d="M640 520c-70-4-150 8-196 40-30 22-6 46 2 70 10 32-6 64-30 90h224z"/>

  <!-- Riverside path -->
  <path fill="none" stroke="#d8c49d" stroke-width="12" stroke-linecap="round" d="M640 606c-60-2-112 10-140 32-22 18-30 48-34 82"/>

  <!-- Two people walking together on the path -->
  <g>
    <!-- carer -->
    <path fill="#2a3940" d="M553 625l-3 22h5l3-14 2 14h5l-2-22z"/>
    <path fill="#6b3a6e" d="M549 626c0-12 3-22 10-22s10 10 10 22z"/>
    <circle cx="559" cy="596" r="7" fill="#c98e6a"/>
    <path fill="#3a2a22" d="M552 594c0-6 4-9 8-9s7 3 7 8c-3-3-9-3-15 1z"/>
    <!-- older person with walking stick -->
    <path fill="#2a3940" d="M528 628l-3 20h5l3-13 2 13h5l-2-20z"/>
    <path fill="#2f6470" d="M524 630c0-13 3-23 11-23s10 10 10 23z"/>
    <circle cx="535" cy="599" r="7" fill="#e2b48f"/>
    <path fill="#eef0ee" d="M528 598c-1-6 3-10 8-10s8 4 7 9c-4-3-10-3-15 1z"/>
    <path fill="none" stroke="#4a3b2c" stroke-width="2.4" stroke-linecap="round" d="M524 620l-6 28"/>
    <path fill="none" stroke="#2f6470" stroke-width="5" stroke-linecap="round" d="M544 616l6 2"/>
  </g>

  <!-- Heather and grasses in the foreground -->
  <g fill="#8b5a8e">
    <circle cx="590" cy="664" r="5"/><circle cx="600" cy="658" r="4.5"/><circle cx="610" cy="666" r="5"/>
    <circle cx="596" cy="672" r="4"/><circle cx="620" cy="660" r="4"/>
    <circle cx="44" cy="640" r="5"/><circle cx="54" cy="634" r="4.5"/><circle cx="64" cy="642" r="5"/><circle cx="52" cy="648" r="4"/>
    <circle cx="96" cy="672" r="4"/><circle cx="104" cy="666" r="4.5"/><circle cx="112" cy="674" r="4"/>
  </g>
  <g fill="#a676a8">
    <circle cx="604" cy="664" r="2.5"/><circle cx="58" cy="640" r="2.5"/><circle cx="104" cy="671" r="2.2"/>
  </g>
  <g fill="none" stroke="#2f5a3f" stroke-width="2.2" stroke-linecap="round">
    <path d="M30 700c2-10 6-18 12-24M38 702c0-8 2-16 6-22M480 690c-2-10-6-16-12-22M488 692c0-8-2-14-4-20"/>
    <path d="M150 700c2-8 6-14 10-18M630 700c-2-8-6-14-10-18"/>
  </g>
</svg>
